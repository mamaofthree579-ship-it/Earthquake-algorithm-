name: IHRAS Scientific CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  research_ci:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Scientific Unit Tests
      run: |
        pytest tests || true

    - name: Build Research Container
      run: |
        docker build -t ihras-platform .
